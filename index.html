    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0d6efd', // Bootstrap Primary Blue equivalent
              secondary: '#6c757d', // Bootstrap Secondary Grey equivalent
              success: '#198754',
              danger: '#dc3545',
              warning: '#ffc107',
              info: '#0dcaf0',
              light: '#f8f9fa',

            }

      }

    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;

      ::-webkit-scrollbar-thumb {
